<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timeflow — Daily tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="tracker" aria-label="Daily time tracker">
        <div class="activity-picker" aria-label="Choose activity">
          <div class="activity-options" id="activity-options"></div>
        </div>
        <div class="timeline" id="timeline"></div>
      </section>
      <section class="bottom-dashboard" aria-label="Daily totals and live clock">
        <div class="clock-streak">
          <div class="clock bottom-clock" id="clock" aria-label="Live analogue clock"></div>
          <strong class="streak-count" id="streak-count" aria-label="Day 4 of a 90 day streak">4/90</strong>
          <button class="restart-button" id="restart" type="button">↺ Clear today</button>
        </div>
        <div class="tag-summary" id="tag-summary" aria-label="Total time per activity"></div>
      </section>

    </main>

    <div class="toast" id="toast" role="status"></div>
    <script src="./app.js"></script>
  </body>
</html>
